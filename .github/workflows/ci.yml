name: Java CI

on:
  push:
    branches: [ master ] # 注意你截图里是 master 分支，别写错

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '8'    # 按你项目实际 JDK 版本改
          distribution: 'temurin'
          cache: 'maven'

      - run: mvn -B clean package -DskipTests